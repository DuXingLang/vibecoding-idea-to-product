# GitHub Actions CI

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 检查 Markdown 文件格式
        uses: DavidAnson/markdownlint-cli2-action@v16
        with:
          globs: "**/*.md"

      - name: 检查 SKILL.md 是否存在
        run: |
          if [ ! -f "SKILL.md" ]; then
            echo "❌ SKILL.md 文件缺失！"
            exit 1
          fi
          echo "✅ SKILL.md 存在"

      - name: 检查 LICENSE 文件
        run: |
          if [ ! -f "LICENSE" ]; then
            echo "❌ LICENSE 文件缺失！"
            exit 1
          fi
          echo "✅ LICENSE 存在"

      - name: 检查必要目录
        run: |
          for dir in docs .github/ISSUE_TEMPLATE; do
            if [ ! -d "$dir" ]; then
              echo "❌ 目录 $dir 缺失！"
              exit 1
            fi
          done
          echo "✅ 所有必要目录都存在"